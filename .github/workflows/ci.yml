name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned by commit hash (the version is in the comment). The repository is public: no secrets are used
# here, and a pull request from a fork gets a read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  web:
    name: Web check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the build number comes from the commit time of HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # pnpm comes from the "packageManager" field of package.json
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # the contract copy is untouched and lib/api/schema.d.ts is what the generator makes of it
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # warns only until P5.5, then it fails the run (see AGENTS.md)
      - run: pnpm check:no-mocks
