      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    City:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
      example:
        id: 0192f1c6-2222-7000-8000-000000000002
        name: Kazan
        region: Tatarstan
    CityList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/City'
    CreatorRef:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    CreatorSummary:
      type: object
