          $ref: '#/components/schemas/AccountStatus'
      example:
        id: 0192f1c6-5555-7000-8000-000000000005
        email: anna@example.org
        name: Anna
        status: ACTIVE
    AdminCreatorView:
      type: object
      description: Everything a moderator needs to decide, including content that waits for approval.
      required: [profile, owner, listings, portfolioItems]
      properties:
        profile:
          $ref: '#/components/schemas/MyCreatorProfile'
        owner:
          $ref: '#/components/schemas/AdminUserRef'
        listings:
          type: array
          items:
            $ref: '#/components/schemas/MyListing'
        portfolioItems:
          type: array
          items:
            $ref: '#/components/schemas/MyPortfolioItem'
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Shown to the creator for a rejection; kept in the audit log for every decision.
      example:
        reason: The photos do not show your own work.
    ContentKind:
      type: string
      enum: [AVATAR, LISTING, LISTING_PHOTO, PORTFOLIO_ITEM]
    ContentRef:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ContentKind'
        id:
          type: string
          format: uuid
          description: Id of the listing, photo or work; omitted for `AVATAR`.
      example:
        kind: PORTFOLIO_ITEM
        id: 0192f1c6-4444-7000-8000-000000000004
    ApproveContentRequest:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          description: What to approve; omit to approve everything that waits.
          items:
            $ref: '#/components/schemas/ContentRef'
    RejectContentRequest:
      type: object
      required: [items, reason]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentRef'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
      example:
        items:
          - kind: PORTFOLIO_ITEM
            id: 0192f1c6-4444-7000-8000-000000000004
        reason: The work is not yours.
    InquiryMetricsBucket:
      type: object
      required: [periodStart, newConversations, conversationsWithCreatorReply, activeShowcases]
      properties:
        periodStart:
          type: string
          format: date
        newConversations:
          type: integer
          format: int32
          minimum: 0
        conversationsWithCreatorReply:
          type: integer
          format: int32
          minimum: 0
        replyRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: '`conversationsWithCreatorReply / newConversations`; omitted when there are no new conversations.'
        activeShowcases:
          type: integer
          format: int32
          minimum: 0
    InquiryMetrics:
      type: object
      required: [groupBy, buckets]
      properties:
        groupBy:
          type: string
          enum: [month]
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/InquiryMetricsBucket'
      example:
        groupBy: month
        buckets:
          - periodStart: '2026-10-01'
            newConversations: 10
            conversationsWithCreatorReply: 6
            replyRate: 0.6
            activeShowcases: 12
    ShowcaseMetricsBucket:
      type: object
      required: [periodStart, newlyPublished, activeShowcases]
      properties:
        periodStart:
          type: string
          format: date
        newlyPublished:
          type: integer
          format: int32
          minimum: 0
        activeShowcases:
          type: integer
          format: int32
          minimum: 0
    ShowcaseStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: '#/components/schemas/ShowcaseStatus'
        count:
          type: integer
          format: int32
          minimum: 0
    ShowcaseMetrics:
      type: object
      required: [groupBy, buckets, byStatus]
      properties:
        groupBy:
          type: string
          enum: [month]
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ShowcaseMetricsBucket'
        byStatus:
          type: array
          description: Current number of showcases per status.
          items:
            $ref: '#/components/schemas/ShowcaseStatusCount'
      example:
        groupBy: month
        buckets:
          - periodStart: '2026-10-01'
            newlyPublished: 4
            activeShowcases: 12
        byStatus:
          - status: PUBLISHED
            count: 12
          - status: PENDING_REVIEW
            count: 3
    ConversationRole:
      type: string
      description: Which side of the conversation the caller is.
      enum: [BUYER, CREATOR]
    Participant:
      type: object
      description: The other side of a conversation. For a deleted account `deleted` is true and `name` is omitted; the client shows "Deleted user".
      required: [deleted]
      properties:
        name:
          type: string
        avatar:
          $ref: '#/components/schemas/ImageRef'
        creatorId:
          type: string
          format: uuid
          description: The showcase of the participant when the participant is the creator and the showcase is public.
        deleted:
          type: boolean
    ListingRef:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
    Message:
      type: object
      required: [id, seq, mine, text, createdAt]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Position inside the conversation, 1, 2, 3 without gaps.
        mine:
          type: boolean
          description: Whether the caller wrote it.
        text:
          type: string
          minLength: 1
          maxLength: 4000
        listing:
          $ref: '#/components/schemas/ListingRef'
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f1c6-7777-7000-8000-000000000007
        seq: 1
        mine: true
        text: Hello! Is the blue mug still available?
        createdAt: '2026-10-26T13:00:00Z'
    Conversation:
      type: object
      required: [id, myRole, counterpart, lastSeq, unreadCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        myRole:
          $ref: '#/components/schemas/ConversationRole'
        counterpart:
          $ref: '#/components/schemas/Participant'
        originListing:
          $ref: '#/components/schemas/ListingRef'
        lastSeq:
          type: integer
          format: int64
          minimum: 0
          description: Sequence number of the newest message; 0 when there is none.
        unreadCount:
          type: integer
          format: int32
          minimum: 0
          description: Messages of the other side the caller has not read.
        lastMessage:
          $ref: '#/components/schemas/Message'
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
      example:
        id: 0192f1c6-8888-7000-8000-000000000008
        myRole: BUYER
        counterpart:
          name: Anna Ceramics
          creatorId: 0192f1c6-2a7e-7d3a-9d6c-5b1f3a0c4e11
          deleted: false
        lastSeq: 1
        unreadCount: 0
        lastMessage:
          id: 0192f1c6-7777-7000-8000-000000000007
          seq: 1
          mine: true
          text: Hello! Is the blue mug still available?
          createdAt: '2026-10-26T13:00:00Z'
        createdAt: '2026-10-26T13:00:00Z'
        lastMessageAt: '2026-10-26T13:00:00Z'
    ConversationPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Conversation'
    StartConversationRequest:
      type: object
      required: [creatorId, text, clientMessageId]
      properties:
        creatorId:
          type: string
          format: uuid
          description: The showcase to write to.
        listingId:
          type: string
          format: uuid
          description: A listing of that showcase, shown as a card with the message.
        text:
          type: string
          minLength: 1
          maxLength: 4000
        clientMessageId:
          type: string
          format: uuid
          description: Generated by the client; a repeat with the same value never duplicates the message.
      example:
        creatorId: 0192f1c6-2a7e-7d3a-9d6c-5b1f3a0c4e11
        text: Hello! Is the blue mug still available?
        clientMessageId: 3f1c2b4a-5d6e-4f70-8a9b-0c1d2e3f4a5b
    SendMessageRequest:
      type: object
      required: [text, clientMessageId]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        clientMessageId:
          type: string
          format: uuid
      example:
        text: Yes, it is in stock.
        clientMessageId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
    MessageList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        hasMore:
          type: boolean
          description: True when more messages after the last one returned wait; ask again with the new `after`.
      example:
        items:
          - id: 0192f1c6-7777-7000-8000-000000000007
            seq: 1
            mine: false
            text: Hello! Is the blue mug still available?
            createdAt: '2026-10-26T13:00:00Z'
        hasMore: false
    InboxSummary:
      type: object
      required: [unreadConversations, unreadMessages]
      properties:
        unreadConversations:
          type: integer
          format: int32
          minimum: 0
        unreadMessages:
          type: integer
          format: int32
          minimum: 0
      example:
        unreadConversations: 1
        unreadMessages: 2
