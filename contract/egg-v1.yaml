      required: [id, displayName, category, tags]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        city:
          $ref: '#/components/schemas/City'
        avatar:
          $ref: '#/components/schemas/ImageRef'
        tags:
          type: array
          items:
            type: string
    CreatorSummaryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CreatorSummary'
    CreatorProfile:
      type: object
      description: A published showcase. Optional values (`bio`, `city`, `avatar`) are omitted when absent and `tags` may be empty, so the page can hide empty sections.
      required: [id, displayName, category, tags, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 2000
        category:
          $ref: '#/components/schemas/CategoryRef'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 30
        city:
          $ref: '#/components/schemas/City'
        avatar:
          $ref: '#/components/schemas/ImageRef'
        publishedAt:
          type: string
          format: date-time
      example:
        id: 0192f1c6-2a7e-7d3a-9d6c-5b1f3a0c4e11
        displayName: Anna Ceramics
        bio: Wheel-thrown tableware, glazed by hand.
        category:
          id: 0192f1c6-1111-7000-8000-000000000001
          slug: ceramics
          name: Ceramics
        tags: [mugs, handmade]
        publishedAt: '2026-10-25T09:30:00Z'
    ListingType:
      type: string
      enum: [SERVICE, READY_PRODUCT, MADE_TO_ORDER]
    ListingSummary:
      type: object
      description: A listing card in lists. `priceFromMinor` is omitted for "by agreement".
      required: [id, creator, type, title, category, currency, deliveryAvailable]
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/CreatorRef'
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/CategoryRef'
        priceFromMinor:
          type: integer
          format: int64
          minimum: 0
          description: Starting price in minor units (kopecks); omitted means "by agreement".
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: RUB
        city:
          $ref: '#/components/schemas/City'
        deliveryAvailable:
          type: boolean
        photo:
          $ref: '#/components/schemas/ImageRef'
    ListingSummaryPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ListingSummary'
    Listing:
      type: object
      description: |
        A listing. Fields specific to a type are present only for that type: `durationText` for `SERVICE`, `inStock` for `READY_PRODUCT`, `leadTimeDays` (1..365) for `MADE_TO_ORDER`. `priceFromMinor` is omitted for "by agreement".
      required: [id, creator, type, title, description, category, currency, deliveryAvailable, attributes, photos]
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: '#/components/schemas/CreatorRef'
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        category:
          $ref: '#/components/schemas/CategoryRef'
        priceFromMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        city:
          $ref: '#/components/schemas/City'
        deliveryAvailable:
          type: boolean
        durationText:
          type: string
          maxLength: 100
        inStock:
          type: boolean
        leadTimeDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
        attributes:
          type: object
          description: Free-form parameters of the listing (size, material, and so on).
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 200
        photos:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ImageRef'
      example:
        id: 0192f1c6-3333-7000-8000-000000000003
        creator:
          id: 0192f1c6-2a7e-7d3a-9d6c-5b1f3a0c4e11
          displayName: Anna Ceramics
        type: READY_PRODUCT
        title: Handmade mug
        description: Stoneware mug, 300 ml, dishwasher safe.
        category:
          id: 0192f1c6-1111-7000-8000-000000000001
          slug: ceramics
          name: Ceramics
        priceFromMinor: 250000
        currency: RUB
        deliveryAvailable: true
        inStock: true
        attributes:
          volume: 300 ml
        photos: []
    PortfolioItem:
      type: object
      required: [id, category, image]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/CategoryRef'
        subcategory:
          $ref: '#/components/schemas/CategoryRef'
        image:
          $ref: '#/components/schemas/ImageRef'
    PortfolioItemPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PortfolioItem'
    GalleryItem:
      type: object
      description: A work in the feed. The size of the tile comes from `image.width` and `image.height`.
      required: [id, creatorId, category, image]
      properties:
        id:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        category:
          $ref: '#/components/schemas/CategoryRef'
        image:
          $ref: '#/components/schemas/ImageRef'
    GalleryItemPage:
      allOf:
        - $ref: '#/components/schemas/CursorPage'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GalleryItem'
    MediaUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The image file (JPEG, PNG or WebP).
    MediaUpload:
      type: object
      required: [id, image]
      properties:
        id:
          type: string
          format: uuid
          description: Media id; reference it from avatar, listing photo or portfolio item requests.
        image:
          $ref: '#/components/schemas/ImageRef'
      example:
        id: 0192f1c6-6666-7000-8000-000000000006
        image:
          width: 1600
          height: 1200
          variants:
            - width: 320
              url: https://media.example.org/m/0a0b0c/320.jpg
            - width: 640
              url: https://media.example.org/m/0a0b0c/640.jpg
            - width: 1280
              url: https://media.example.org/m/0a0b0c/1280.jpg
    ShowcaseStatus:
      type: string
      description: Lifecycle of a showcase; changed only by moderation.
      enum: [DRAFT, PENDING_REVIEW, PUBLISHED, REJECTED, WITHDRAWN]
    SuspensionReason:
      type: string
      description: A showcase with any reason is hidden from the public, whatever its status.
      enum: [ADMIN, ACCOUNT_SUSPENDED]
    ReviewStatus:
      type: string
      description: |
        Review state of a piece of content. Before the first publication all content waits (`PENDING`) and is approved together with the showcase; on a published showcase new images and listings wait for approval while the previously approved version stays public.
      enum: [APPROVED, PENDING, REJECTED]
    ListingStatus:
      type: string
      description: '`HIDDEN` listings are not public but stay editable.'
      enum: [ACTIVE, HIDDEN]
    MissingRequirement:
      type: string
      enum: [DISPLAY_NAME, CATEGORY, LISTING_MIN_1, PORTFOLIO_MIN_3]
    ReviewedImage:
      type: object
      required: [image, reviewStatus]
      properties:
        image:
          $ref: '#/components/schemas/ImageRef'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        rejectionReason:
          type: string
          description: Present when `reviewStatus` is `REJECTED`.
    CreatorProfileInput:
      type: object
      description: Every field is optional, so a draft can be saved step by step.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 2000
        categoryId:
          type: string
          format: uuid
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 30
        cityId:
          type: string
          format: uuid
        avatarMediaId:
          type: string
          format: uuid
          description: Media id from `uploadMedia`; omitted keeps the current avatar.
      example:
        displayName: Anna Ceramics
        bio: Wheel-thrown tableware, glazed by hand.
        categoryId: 0192f1c6-1111-7000-8000-000000000001
        tags: [mugs, handmade]
    MyCreatorProfile:
      type: object
      description: The showcase as its creator sees it. Optional values are omitted when absent.
      required: [id, status, suspensionReasons, tags, changedSinceReview, createdAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShowcaseStatus'
        suspensionReasons:
          type: array
          items:
            $ref: '#/components/schemas/SuspensionReason'
        displayName:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 2000
        category:
          $ref: '#/components/schemas/CategoryRef'
        tags:
          type: array
          maxItems: 10
          items:
            type: string
        city:
          $ref: '#/components/schemas/City'
        avatar:
          $ref: '#/components/schemas/ReviewedImage'
        pendingAvatar:
          $ref: '#/components/schemas/ReviewedImage'
        rejectionReason:
          type: string
          description: Present while `status` is `REJECTED`.
        changedSinceReview:
          type: boolean
          description: A published showcase whose text was edited after the last review (it is in the "changed" queue of moderation).
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      example:
        id: 0192f1c6-2a7e-7d3a-9d6c-5b1f3a0c4e11
        status: DRAFT
        suspensionReasons: []
        displayName: Anna Ceramics
        category:
          id: 0192f1c6-1111-7000-8000-000000000001
          slug: ceramics
          name: Ceramics
        tags: [mugs, handmade]
        changedSinceReview: false
        createdAt: '2026-10-26T12:00:00Z'
    PublicationChecklist:
      type: object
      required: [ready, missing]
      properties:
        ready:
          type: boolean
          description: True when nothing is missing and the showcase can be submitted for review.
        missing:
          type: array
          items:
            $ref: '#/components/schemas/MissingRequirement'
      example:
        ready: false
        missing: [LISTING_MIN_1, PORTFOLIO_MIN_3]
    ListingInput:
      type: object
      required: [title, categoryId]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        categoryId:
          type: string
          format: uuid
        priceFromMinor:
          type: integer
          format: int64
          minimum: 0
          description: Starting price in minor units (kopecks); omitted means "by agreement".
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: RUB
        cityId:
          type: string
          format: uuid
        deliveryAvailable:
          type: boolean
          default: false
        durationText:
          type: string
          maxLength: 100
          description: Only for `SERVICE`.
        inStock:
          type: boolean
          description: Only for `READY_PRODUCT`.
        leadTimeDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: Required for `MADE_TO_ORDER`, absent for other types.
        attributes:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 200
        status:
          $ref: '#/components/schemas/ListingStatus'
      example:
        title: Handmade mug
        description: Stoneware mug, 300 ml, dishwasher safe.
        categoryId: 0192f1c6-1111-7000-8000-000000000001
        priceFromMinor: 250000
        deliveryAvailable: true
        inStock: true
        attributes:
          volume: 300 ml
    CreateListingRequest:
      description: The fields of a listing plus its type, which never changes afterwards.
      allOf:
        - $ref: '#/components/schemas/ListingInput'
        - type: object
          required: [type]
          properties:
            type:
              $ref: '#/components/schemas/ListingType'
