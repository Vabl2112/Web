        category: NEW_MESSAGE
    Subcategory:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    Category:
      type: object
      required: [id, slug, name, children]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Subcategory'
      example:
        id: 0192f1c6-1111-7000-8000-000000000001
        slug: ceramics
        name: Ceramics
        children:
          - id: 0192f1c6-1111-7000-8000-000000000011
            slug: tableware
            name: Tableware
    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    CategoryRef:
      type: object
