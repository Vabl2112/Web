      properties:
        id:
          type: string
          format: uuid
        image:
          $ref: '#/components/schemas/ImageRef'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        rejectionReason:
          type: string
    MyListing:
      type: object
      description: A listing as its creator sees it, with review states and every photo.
      required: [id, type, title, description, category, currency, deliveryAvailable, attributes, status, reviewStatus, photos, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        priceFromMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        city:
          $ref: '#/components/schemas/City'
        deliveryAvailable:
          type: boolean
        durationText:
          type: string
        inStock:
          type: boolean
        leadTimeDays:
          type: integer
          format: int32
        attributes:
          type: object
          additionalProperties:
            type: string
        status:
          $ref: '#/components/schemas/ListingStatus'
        reviewStatus:
          $ref: '#/components/schemas/ReviewStatus'
        rejectionReason:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/ListingPhoto'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 0192f1c6-3333-7000-8000-000000000003
